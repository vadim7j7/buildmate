name: react-native
display_name: React Native + Expo
description: Mobile development with React Native and Expo SDK

default_model: opus

compatible_with:
  - rails
  - ruby
  - sinatra
  - fastapi
  - flask
  - python
  - django
  - express
  - go
  - gin
  - fiber
  - chi
  - elixir
  - phoenix
  - nextjs

options:
  ui:
    description: UI styling approach
    default: none
    choices:
      none:
        description: Plain StyleSheet (default)
        variables:
          ui_library: StyleSheet
      nativewind:
        description: Tailwind CSS for React Native
        styles:
          - styles/nativewind.md
        variables:
          ui_library: NativeWind
      tamagui:
        description: Universal UI kit with optimal performance
        styles:
          - styles/tamagui.md
        variables:
          ui_library: Tamagui
      gluestack:
        description: Universal component library
        styles:
          - styles/gluestack.md
        variables:
          ui_library: Gluestack UI

  state:
    description: State management solution
    default: zustand
    choices:
      zustand:
        description: Lightweight, hooks-based state management
        patterns:
          - patterns/zustand.md
        skills:
          - new-store
        variables:
          state_library: Zustand
      mobx:
        description: Observable-based reactive state management
        patterns:
          - patterns/mobx.md
        skills:
          - new-store
        variables:
          state_library: MobX
      redux:
        description: Predictable state container with Redux Toolkit
        patterns:
          - patterns/redux.md
        skills:
          - new-store
        variables:
          state_library: Redux Toolkit
      jotai:
        description: Primitive and flexible atomic state management
        patterns:
          - patterns/jotai.md
        skills:
          - new-store
        variables:
          state_library: Jotai
      none:
        description: No global state management (React Query only)
        variables:
          state_library: None

  languages:
    description: Locale set for i18n (kept identical across mobile + landing)
    default: standard
    choices:
      minimal:
        description: English + Spanish only
        variables:
          locales: "en,es"
          default_locale: en
          locale_count: 2
      standard:
        description: Full 18-locale union set used across all apps
        variables:
          locales: "en,es,fr,de,it,pt-BR,nl,pl,tr,vi,id,ja,ko,ru,zh,tl,th,ms"
          default_locale: en
          locale_count: 18

agents:
  - name: mobile-developer
    template: agents/mobile-developer.md.j2
    description: React Native + Expo implementation specialist
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-screen
      - new-rn-component
      - new-store
      - new-query
      - new-db-query

  - name: mobile-tester
    template: agents/mobile-tester.md.j2
    description: Jest + React Native Testing Library specialist
    model: sonnet
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - test

  - name: mobile-code-reviewer
    template: agents/mobile-code-reviewer.md.j2
    description: React Native code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - test
  - review
  - docs
  - verify
  - new-screen
  - new-rn-component
  - new-store
  - new-query
  - new-db-query
  - platform-check
  - new-hook
  - new-navigation
  - clone-page
  - analyze-site

quality_gates:
  typecheck:
    command: npx tsc --noEmit
    description: TypeScript type checking
  lint:
    command: npm run lint
    fix_command: npm run lint -- --fix
    description: ESLint checks
  tests:
    command: npm test
    description: Jest test suite

working_dir: "."

patterns:
  - patterns/mobile-patterns.md
  - patterns/offline.md
  - patterns/push-notifications.md
  - patterns/logging.md
  - patterns/error-tracking.md
  - patterns/browser-cloning.md
  - patterns/verification.md
  - patterns/drizzle-sqlite.md
  - patterns/mobile-i18n.md
  - patterns/fastlane-screenshots.md
  - patterns/eas-build.md

styles:
  - styles/react-native.md

# Real project files written into the app on bootstrap (mobile/ in multi-stack).
# .j2 files are Jinja-rendered with `variables` (so the locale set is baked in).
scaffold:
  enabled: true

setup:
  install_command: npm install
  post_install:
    - npx expo install
  dev_server_check: node -v && npm -v

variables:
  framework: React Native + Expo (SDK 54+)
  language: TypeScript (strict mode)
  test_framework: Jest + React Native Testing Library
  ui_state: Zustand
  server_state: React Query (TanStack Query v5)
  database: Drizzle ORM (SQLite)
  navigation: expo-router
  lists: FlashList
  i18n: i18next + expo-localization
  # Locale defaults — overridden by the `languages` option / profile.
  locales: "en,es,fr,de,it,pt-BR,nl,pl,tr,vi,id,ja,ko,ru,zh,tl,th,ms"
  default_locale: en
  locale_count: 18
  dev_port: 8081

verification:
  enabled: true
  auto_verify: true
  max_retries: 3
  dev_server:
    command: npx expo start --no-dev
    port: 8081
