name: go
display_name: Go
description: Generic Go development with modern tooling

default_model: opus

compatible_with:
  - nextjs
  - nuxt
  - react-native
  - browser-extension
  - scraping

options:
  db:
    description: Database system
    default: postgresql
    choices:
      postgresql:
        description: PostgreSQL with pgx v5 (pgxpool)
        variables:
          database: PostgreSQL
          orm: pgx v5 (pgxpool)
          db_driver: github.com/jackc/pgx/v5
      mysql:
        description: MySQL with database/sql and go-sql-driver/mysql
        variables:
          database: MySQL
          orm: database/sql
          db_driver: github.com/go-sql-driver/mysql
      sqlite:
        description: SQLite with database/sql and the pure-Go modernc driver
        variables:
          database: SQLite
          orm: database/sql
          db_driver: modernc.org/sqlite
      mongodb:
        description: MongoDB with the official Go driver v2
        patterns:
          - patterns/mongodb.md
        variables:
          database: MongoDB
          orm: official MongoDB Go driver v2
          db_driver: go.mongodb.org/mongo-driver/v2

agents:
  - name: backend-developer
    template: agents/backend-developer.md.j2
    description: Go developer
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-handler
      - new-service
      - new-model

  - name: backend-tester
    template: agents/backend-tester.md.j2
    description: Go testing specialist
    model: sonnet
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - test

  - name: backend-reviewer
    template: agents/backend-reviewer.md.j2
    description: Go code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - test
  - review
  - docs
  - verify
  - new-handler
  - new-service
  - new-model

quality_gates:
  format:
    command: test -z "$(gofmt -l .)"
    fix_command: gofmt -w .
    description: Go code formatting
  lint:
    command: golangci-lint run ./...
    fix_command: golangci-lint run --fix ./...
    description: Go linting with golangci-lint
  tests:
    command: go test ./...
    description: Go test suite

patterns:
  - patterns/backend-patterns.md

styles:
  - styles/backend-go.md

setup:
  install_command: go mod download
  dev_server_check: go version

variables:
  framework: Go
  language: Go 1.25+
  test_framework: testing + testify
  linter: golangci-lint
  # Fallbacks only: the db option (default postgresql) always sets orm, db_driver and database.
  orm: database/sql
  db_driver: github.com/jackc/pgx/v5
  database: PostgreSQL
