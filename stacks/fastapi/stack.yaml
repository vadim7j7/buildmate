name: fastapi
extends: python
display_name: Python FastAPI
description: Backend development with Python FastAPI

compatible_with:
  - nextjs
  - nuxt
  - react-native
  - browser-extension
  - scraping

agents:
  - name: backend-developer
    template: agents/backend-developer.md.j2
    description: FastAPI backend developer
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-router
      - new-schema
      - new-model
      - new-service
      - new-migration
      - new-task

  - name: backend-tester
    template: agents/backend-tester.md.j2
    description: pytest testing specialist
    model: sonnet
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-test
      - test

  - name: backend-reviewer
    template: agents/backend-reviewer.md.j2
    description: Python/FastAPI code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - new-router
  - new-schema
  - new-model
  - new-service
  - new-migration
  - new-test
  - new-task
  - new-middleware
  - new-dependency

patterns:
  - patterns/fastapi-patterns.md

# Installed too, but read only when the task touches the topic (the developer
# would otherwise read ~6k lines before writing any code)
reference_patterns:
  - patterns/app-setup.md
  - patterns/testing.md
  - patterns/security.md
  - patterns/pitfalls.md
  - patterns/oauth.md
  - patterns/pagination.md
  - patterns/rate-limiting.md
  - patterns/caching.md
  - patterns/logging.md
  - patterns/error-tracking.md
  - patterns/verification.md

# FastAPI goes through Beanie for MongoDB (the python parent uses plain PyMongo)
options:
  db:
    description: Database system
    default: postgresql
    choices:
      postgresql:
        description: PostgreSQL with async driver
        variables:
          database: PostgreSQL
          db_adapter: asyncpg
      mysql:
        description: MySQL with async driver
        variables:
          database: MySQL
          db_adapter: aiomysql
      sqlite:
        description: SQLite for simple projects
        variables:
          database: SQLite
          db_adapter: aiosqlite
      mongodb:
        description: MongoDB with Beanie (on the PyMongo Async API)
        patterns:
          - patterns/mongodb.md
        variables:
          database: MongoDB
          db_adapter: pymongo (AsyncMongoClient)
          orm: Beanie 2.x (on the PyMongo Async API)
          migrations: none for schema (Beanie documents; indexes declared in Settings, data fixes as scripts)

styles:
  - styles/async-patterns.md

variables:
  framework: FastAPI
  test_framework: pytest + pytest-asyncio
  tasks: Celery
  dev_port: 8000

verification:
  enabled: true
  auto_verify: true
  max_retries: 3
  dev_server:
    command: uv run uvicorn app.main:app --reload --port 8000
    port: 8000
    health_check: /health
