name: django
extends: python
display_name: Django Web Application
description: Web development with Django and Django REST Framework

compatible_with:
  - nextjs
  - nuxt
  - react-native
  - browser-extension

agents:
  - name: backend-developer
    template: agents/backend-developer.md.j2
    description: Django web developer
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-view
      - new-serializer
      - new-url-config
      - new-model
      - new-service
      - new-migration
      - db-migrate

  - name: backend-tester
    template: agents/backend-tester.md.j2
    description: Django/pytest testing specialist
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-test
      - test

  - name: backend-reviewer
    template: agents/backend-reviewer.md.j2
    description: Django code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - new-view
  - new-serializer
  - new-url-config
  - new-model
  - new-schema
  - new-service
  - new-test
  - new-migration
  - db-migrate
  - test

# Apps live at the project root (<app>/, tests in <app>/tests/), so the python
# parent's `src/ tests/` paths do not apply: check the whole project.
quality_gates:
  format:
    command: uv run ruff format --check .
    fix_command: uv run ruff format .
    description: Code formatting check
  lint:
    command: uv run ruff check .
    fix_command: uv run ruff check --fix .
    description: Ruff linting
  typecheck:
    command: uv run mypy .
    description: Type checking with mypy + django-stubs
  tests:
    command: uv run pytest
    description: pytest + pytest-django (DJANGO_SETTINGS_MODULE in pyproject.toml)

patterns:
  - patterns/django-patterns.md

setup:
  install_command: uv sync
  post_install:
    - uv run python manage.py migrate
  dev_server_check: uv run python --version

variables:
  framework: Django 5.2+
  test_framework: pytest + pytest-django
  orm: Django ORM
  migrations: Django migrations
  validation: DRF serializers
  dev_port: 8000

options:
  db:
    description: Database system
    default: postgresql
    choices:
      postgresql:
        description: PostgreSQL (recommended for production)
        variables:
          database: PostgreSQL
          db_adapter: psycopg
          db_engine: django.db.backends.postgresql
      mysql:
        description: MySQL / MariaDB
        variables:
          database: MySQL
          db_adapter: mysqlclient
          db_engine: django.db.backends.mysql
      sqlite:
        description: SQLite (development only)
        variables:
          database: SQLite
          db_adapter: ""
          db_engine: django.db.backends.sqlite3
      mongodb:
        description: MongoDB with django-mongodb-backend (official, Django 5.2)
        patterns:
          - patterns/mongodb.md
        variables:
          database: MongoDB
          db_adapter: django-mongodb-backend 5.2.x (PyMongo)
          db_engine: django_mongodb_backend
          orm: Django ORM (MongoDB via django-mongodb-backend)

verification:
  enabled: true
  auto_verify: true
  max_retries: 3
  dev_server:
    command: uv run python manage.py runserver 8000
    port: 8000
    health_check: /health
