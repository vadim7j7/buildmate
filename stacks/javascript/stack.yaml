name: javascript
display_name: JavaScript / TypeScript
description: Generic JavaScript and TypeScript development

default_model: opus

compatible_with:
  - react-native
  - browser-extension
  - scraping

agents:
  - name: backend-developer
    template: agents/backend-developer.md.j2
    description: Node.js / TypeScript developer
    model: opus
    tools: [Read, Write, Edit, Bash, Grep, Glob]
  - name: backend-tester
    template: agents/backend-tester.md.j2
    description: Vitest testing specialist
    model: sonnet
    tools: [Read, Write, Edit, Bash, Grep, Glob]
    skills:
      - test
  - name: backend-reviewer
    template: agents/backend-reviewer.md.j2
    description: Node.js / TypeScript code reviewer
    model: opus
    tools: [Read, Grep, Glob, Bash]

skills:
  - test
  - review
  - docs
  - verify

quality_gates:
  typecheck:
    command: npx tsc --noEmit
    description: TypeScript type checking
  lint:
    command: npm run lint
    fix_command: npm run lint -- --fix
    description: ESLint checks
  tests:
    command: npm test
    description: Test suite

patterns:
  - patterns/typescript-patterns.md

# Read when the task touches the topic. Named js-testing.md (not testing.md) so it
# doesn't overwrite a backend's testing.md when a child stack is combined with one.
reference_patterns:
  - patterns/js-testing.md

styles:
  - styles/typescript.md

setup:
  install_command: npm install
  dev_server_check: node -v && npm -v

variables:
  language: TypeScript
  package_manager: npm
  runtime: Node.js 24 LTS
  framework: Node.js + TypeScript
  test_framework: Vitest
  linter: ESLint (flat config)
