name: express
extends: javascript
display_name: Express.js API
description: Backend API development with Express.js and TypeScript

compatible_with:
  - nextjs
  - nuxt
  - react-native
  - browser-extension
  - scraping

agents:
  - name: backend-developer
    template: agents/backend-developer.md.j2
    description: Express.js backend developer
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-router
      - new-middleware
      - new-controller
      - new-model
      - db-migrate

  - name: backend-tester
    template: agents/backend-tester.md.j2
    description: Vitest + Supertest testing specialist
    model: sonnet
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - test
      - new-test

  - name: backend-reviewer
    template: agents/backend-reviewer.md.j2
    description: Express.js code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - new-router
  - new-middleware
  - new-controller
  - new-model
  - db-migrate
  - new-test

# Always read: the core framework pattern (+ the javascript parent's typescript-patterns.md).
patterns:
  - patterns/express-patterns.md

# Read only when the task touches the topic. Prefixed names: a frontend installed
# next to Express (express+nextjs) ships its own security/auth/testing files.
reference_patterns:
  - patterns/express-security.md
  - patterns/express-auth.md
  - patterns/express-logging.md
  - patterns/express-pagination.md
  - patterns/express-testing.md

variables:
  framework: Express 5+
  test_framework: Vitest + Supertest
  orm: Prisma
  validation: Zod
  dev_port: 4000

verification:
  enabled: true
  auto_verify: true
  max_retries: 3
  dev_server:
    command: PORT=4000 npm run dev
    port: 4000
    health_check: /health
