name: fiber
extends: go
display_name: Fiber Web Framework
description: Express-inspired web development with Fiber

compatible_with:
  - nextjs
  - nuxt
  - react-native
  - browser-extension
  - scraping

agents:
  - name: backend-developer
    template: agents/backend-developer.md.j2
    description: Fiber web developer
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-router
      - new-middleware
      - new-handler
      - new-service
      - new-model
      - new-migration
      - db-migrate

  - name: backend-tester
    template: agents/backend-tester.md.j2
    description: Fiber/Go testing specialist
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - test
      - new-test

  - name: backend-reviewer
    template: agents/backend-reviewer.md.j2
    description: Fiber/Go code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - new-router
  - new-middleware
  - new-handler
  - new-service
  - new-model
  - new-migration
  - db-migrate
  - test
  - new-test

patterns:
  - patterns/fiber-patterns.md

# Plus the go parent's reference patterns (auth.md, rate-limiting.md, testing.md...)
reference_patterns:
  - patterns/fiber-auth.md

variables:
  framework: Fiber v3
  language: Go 1.26+  # Fiber v3.6+ requires Go 1.26
  validation: go-playground/validator
  dev_port: 8080

verification:
  enabled: true
  auto_verify: true
  max_retries: 3
  dev_server:
    command: PORT=8080 go run ./cmd/server
    port: 8080
    health_check: /health
