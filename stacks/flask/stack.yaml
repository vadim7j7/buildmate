name: flask
extends: python
display_name: Flask Web Application
description: Web development with Flask and modern Python tooling

compatible_with:
  - nextjs
  - nuxt
  - react-native
  - browser-extension

agents:
  - name: backend-developer
    template: agents/backend-developer.md.j2
    description: Flask web developer
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-blueprint
      - new-route
      - new-model
      - new-schema
      - new-service
      - new-test
      - new-migration
      - db-migrate

  - name: backend-tester
    template: agents/backend-tester.md.j2
    description: Flask/pytest testing specialist
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-test
      - test

  - name: backend-reviewer
    template: agents/backend-reviewer.md.j2
    description: Flask code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - new-blueprint
  - new-route
  - new-model
  - new-schema
  - new-service
  - new-test
  - new-migration
  - db-migrate

patterns:
  - patterns/flask-patterns.md

# Flask is synchronous: override the python parent's async ORM/migrations/drivers.
options:
  db:
    description: Database system
    default: postgresql
    choices:
      postgresql:
        description: PostgreSQL with psycopg 3 (sync)
        variables:
          database: PostgreSQL
          db_adapter: psycopg
          db_url_scheme: postgresql+psycopg
      mysql:
        description: MySQL with PyMySQL (sync)
        variables:
          database: MySQL
          db_adapter: pymysql
          db_url_scheme: mysql+pymysql
      sqlite:
        description: SQLite for simple projects
        variables:
          database: SQLite
          db_adapter: sqlite3 (stdlib)
          db_url_scheme: sqlite

variables:
  framework: Flask 3+
  orm: Flask-SQLAlchemy 3.1 (SQLAlchemy 2.0)
  migrations: Flask-Migrate
  dev_port: 5001

verification:
  enabled: true
  auto_verify: true
  max_retries: 3
  dev_server:
    command: uv run flask run --debug --port 5001
    port: 5001
    health_check: /health
