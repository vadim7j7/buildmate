name: elixir
display_name: Elixir
description: Generic Elixir development on the BEAM VM

default_model: opus

compatible_with:
  - nextjs
  - nuxt
  - react-native
  - browser-extension
  - scraping

options:
  db:
    description: Database system
    default: postgresql
    choices:
      postgresql:
        description: PostgreSQL with Ecto and Postgrex
        variables:
          database: PostgreSQL
          orm: Ecto (ecto_sql) with Postgrex
          db_adapter: Ecto.Adapters.Postgres
          db_driver: postgrex
      mysql:
        description: MySQL with Ecto and MyXQL
        variables:
          database: MySQL
          orm: Ecto (ecto_sql) with MyXQL
          db_adapter: Ecto.Adapters.MyXQL
          db_driver: myxql
      sqlite:
        description: SQLite with Ecto and ecto_sqlite3 (Exqlite)
        variables:
          database: SQLite
          orm: Ecto (ecto_sql) with ecto_sqlite3
          db_adapter: Ecto.Adapters.SQLite3
          db_driver: ecto_sqlite3

agents:
  - name: backend-developer
    template: agents/backend-developer.md.j2
    description: Elixir developer
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-module
      - new-genserver
      - new-supervisor

  - name: backend-tester
    template: agents/backend-tester.md.j2
    description: ExUnit testing specialist
    model: sonnet
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - test

  - name: backend-reviewer
    template: agents/backend-reviewer.md.j2
    description: Elixir code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - test
  - review
  - docs
  - verify
  - new-module
  - new-genserver
  - new-supervisor

quality_gates:
  format:
    command: mix format --check-formatted
    fix_command: mix format
    description: Elixir code formatting
  lint:
    command: mix credo --strict
    description: Credo static analysis (needs the :credo dep, see backend-developer setup)
  typecheck:
    command: mix compile --warnings-as-errors
    description: Compile with warnings as errors (includes Elixir 1.18+ type checks)
  tests:
    command: mix test
    description: ExUnit test suite

patterns:
  - patterns/backend-patterns.md

styles:
  - styles/backend-elixir.md

setup:
  install_command: mix deps.get && mix compile
  dev_server_check: elixir -v && mix --version

variables:
  framework: Elixir
  language: Elixir 1.18+
  runtime: BEAM/OTP 27+
  test_framework: ExUnit
  linter: Credo
  # Fallbacks only: the db option (default postgresql) always sets orm, db_adapter, db_driver and database.
  orm: Ecto
  db_adapter: Ecto.Adapters.Postgres
  db_driver: postgrex
  database: PostgreSQL
