name: nuxt
extends: javascript
inherit_agents: false
display_name: Nuxt 4
description: Full-stack Vue development with Nuxt 4

compatible_with:
  - rails
  - ruby
  - sinatra
  - fastapi
  - flask
  - python
  - django
  - express
  - scraping
  - go
  - gin
  - fiber
  - chi
  - elixir
  - phoenix

options:
  state:
    description: Shared client state
    default: pinia
    choices:
      pinia:
        description: Pinia stores via the @pinia/nuxt module (SSR-safe)
        patterns:
          - patterns/pinia.md
        variables:
          state_library: Pinia
      none:
        description: No store library; Nuxt useState + composables
        variables:
          state_library: None

agents:
  - name: frontend-developer
    template: agents/frontend-developer.md.j2
    description: Nuxt 4 / Vue developer
    model: opus
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - new-page
      - new-component
      - new-composable
      - new-middleware
      - new-plugin
      - new-server-route

  - name: frontend-tester
    template: agents/frontend-tester.md.j2
    description: Vitest testing specialist
    model: sonnet
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    skills:
      - test

  - name: frontend-reviewer
    template: agents/frontend-reviewer.md.j2
    description: Vue / Nuxt code reviewer
    model: opus
    tools:
      - Read
      - Grep
      - Glob
      - Bash

skills:
  - new-page
  - new-component
  - new-composable
  - new-middleware
  - new-plugin
  - new-server-route

# Merged with the javascript parent by key: `lint` (npm run lint) is inherited,
# `typecheck` and `tests` are overridden here.
quality_gates:
  typecheck:
    # `tsc --noEmit` skips .vue files, and Nuxt 4's root tsconfig only holds
    # project references. nuxi typecheck runs vue-tsc with the generated configs.
    command: npx nuxi typecheck
    description: Type checking of .ts and .vue files (vue-tsc)
  tests:
    command: npx vitest run
    description: Vitest test suite

# Always read: the core framework pattern (+ the state option's pattern).
patterns:
  - patterns/nuxt-patterns.md

# Read only when the task touches the topic. Prefixed names: a backend stack
# installed next to Nuxt (rails+nuxt...) ships its own auth/security/testing files.
reference_patterns:
  - patterns/nuxt-auth.md
  - patterns/nuxt-security.md
  - patterns/nuxt-testing.md
  - patterns/nuxt-pitfalls.md

# Overrides the parent setup: Nuxt starters ship without the dev tooling the
# quality gates need (vue-tsc for typecheck, @nuxt/eslint + a "lint" script,
# @nuxt/test-utils for tests). The developer agent adds them if missing.
setup:
  install_command: npm install
  post_install:
    - npm install -D vue-tsc typescript
    - npx nuxi module add eslint
    - npm pkg set scripts.lint="eslint ." scripts.typecheck="nuxi typecheck"
    - npm install -D vitest @nuxt/test-utils @vue/test-utils happy-dom
  dev_server_check: node -v && npx nuxi info

variables:
  framework: Nuxt 4
  state_library: Pinia
  test_framework: Vitest
  ui_framework: Vue 3
  dev_port: 3000

verification:
  enabled: true
  auto_verify: true
  max_retries: 3
  dev_server:
    command: npx nuxt dev
    port: 3000
