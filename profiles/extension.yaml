name: extension
display_name: Browser Extension (React)
description: >-
  Cross-browser web extension built with WXT and React. One codebase ships to
  Chrome, Edge, Firefox, and Safari with Manifest V3, typed messaging, and
  reactive wxt/storage.

stacks:
  - browser-extension

options:
  browser-extension:
    ui: react
    target: chrome

variables:
  project_type: browser-extension
  has_extension: true
